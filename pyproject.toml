[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "session_monitoring_pipeline"
version = "1.0.0"
description = "Production-grade clickstream event sessionization and monitoring pipeline"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Data Engineering Team" }
]
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "streamlit>=1.30.0",
    "altair>=5.0.0",
    "pytest>=8.0.0",
    "psutil>=5.9.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
